experiment:
  name: "humor_classification"
  description: "Can predicted brain responses distinguish humorous from neutral text?"

stimuli:
  path: "stimuli/stimuli.csv"
  modality: "text"

classification:
  n_folds: 5
  regularization_C: 1.0

rois:
  - name: "TPJ"
    glasser: "PGi"
  - name: "STS"
    glasser: "STSv"
  - name: "mPFC"
    glasser: "10v"
  - name: "IFG"
    glasser: "45"
  - name: "Reward"
    glasser: "OFC"

output:
  save_predictions: true
  save_figures: true
  figure_format: "png"
  figure_dpi: 150
